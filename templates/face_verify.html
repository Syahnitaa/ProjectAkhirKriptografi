{% extends "base.html" %}
{% block isi %}
<h2>Verifikasi Wajah</h2>
<p>Password benar. Satu langkah lagi: hadap kamera untuk verifikasi wajah.</p>

<video id="video" autoplay muted playsinline></video>
<p id="status" class="status">Memuat model...</p>
<button id="tombol" disabled>Verifikasi Wajah</button>
<p><a href="/login">Batal</a></p>

<script src="/static/face-api.js"></script>
<script src="/static/face.js"></script>
<script>
  const video = document.getElementById("video");
  const status = document.getElementById("status");
  const tombol = document.getElementById("tombol");

  (async () => {
    try {
      await muatModel();
      await nyalakanKamera(video);
      status.textContent = "Siap. Klik tombol untuk verifikasi.";
      tombol.disabled = false;
    } catch (e) {
      status.textContent = "Gagal: " + e.message + " (izinkan akses kamera)";
    }
  })();

  tombol.onclick = async () => {
    tombol.disabled = true;

    // Ambil 3 rekaman wajah berurutan. Server mewajibkan SEMUANYA cocok.
    const hasil = await rekamWajah(video, 3, (i, n) => {
      status.textContent = "Memindai wajah " + i + " dari " + n + "...";
    });
    if (!hasil) {
      status.textContent = "Wajah tidak terdeteksi. Coba lagi.";
      tombol.disabled = false;
      return;
    }

    const jawaban = await kirimKeServer("/face/verify", { descriptors: hasil });
    status.textContent = jawaban.pesan;

    if (jawaban.ok) {
      window.location.href = jawaban.redirect;
    } else if (jawaban.redirect) {       // terlalu banyak gagal -> kembali ke login
      setTimeout(() => (window.location.href = jawaban.redirect), 1500);
    } else {
      tombol.disabled = false;
    }
  };
</script>
{% endblock %}
